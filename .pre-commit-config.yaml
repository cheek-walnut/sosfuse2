# Commit gate. Only fatal ruff rules (syntax errors, undefined names) block; the default ruff set is report-only.
# ruff excludes (docs) live in pyproject.toml [tool.ruff] (force-exclude = true).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        name: ruff fatal rules (blocking)
        args: [--select, "E9,F63,F7,F82"]
      - id: ruff
        name: ruff default rules (report only)
        args: [--select, "E4,E7,E9,F", --exit-zero, --output-format, concise]
        verbose: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=20480]
      - id: check-merge-conflict
  # Secret scan of the staged changes with the locally installed gitleaks (>= 8.30; config .gitleaks.toml).
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged, blocking)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
  # Public-release identifiers the generic checker does not cover (it skips Markdown and records): session scratch paths,
  # user home paths, rclone work remotes. Built-in pygrep, every text file including docs (2026-11-03 release review).
  - repo: local
    hooks:
      - id: public-identifiers
        name: scratch/home paths and private remotes, all text files (blocking)
        language: pygrep
        entry: '(/private)?/tmp/claude-[0-9]+/|/home/[a-z][a-z0-9_-]*/|/Users/[a-z][a-z0-9_-]*/|[a-z][a-z0-9_-]*:work/|-Users-[A-Za-z0-9]+-Workspace'
        types: [text]
  # Machine-independence rule: no absolute user paths, private addresses or account identifiers in tracked files.
  # `.machine-paths-strict` makes a violation block the commit. The checker is a local tool (not part of the package).
  - repo: local
    hooks:
      - id: check-machine-paths
        name: machine-specific paths, addresses, accounts (blocking)
        entry: check-machine-paths
        language: system
        pass_filenames: true
        verbose: true
