# Public CI = tier 1 of docs/CHECKS.md: build the sdist, install it outside the source tree, run the packaged tests
# from the installed package (no SOSFUSE2_SKY_SOS_ROOT, no GPU). The CUDA gates (tier 2/3) are manual, see docs/CHECKS.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.17.1"
      # fatal rules only (same as the pre-commit blocking hook); only docs are excluded in pyproject
      - run: ruff check --select E9,F63,F7,F82 .

  shard-config:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.config.outputs.count }}
      indices: ${{ steps.config.outputs.indices }}
    steps:
      - id: config
        run: |
          count=4
          if ! [[ "$count" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Invalid shard count' >&2
            exit 1
          fi
          indices=
          for ((index=0; index<count; index++)); do
            if [ -n "$indices" ]; then indices+=','; fi
            indices+="$index"
          done
          printf 'count=%s\nindices=[%s]\n' "$count" "$indices" >> "$GITHUB_OUTPUT"

  tests:
    needs: [lint, shard-config]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
        shard: ${{ fromJSON(needs.shard-config.outputs.indices) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # the persistent-queue cases start a 4-state NumPy queue; CI hosts need more than the 60 s default (docs/CHECKS.md)
      PERSISTENT_TEST_DEADLINE: "2400"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate shard configuration
        env:
          SHARD_COUNT: ${{ needs.shard-config.outputs.count }}
          SHARD_INDICES: ${{ needs.shard-config.outputs.indices }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os
          count = int(os.environ['SHARD_COUNT'])
          indices = json.loads(os.environ['SHARD_INDICES'])
          index = int(os.environ['SHARD_INDEX'])
          if count < 1 or indices != list(range(count)) or index not in indices:
              raise SystemExit('Invalid shard configuration')
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the sdist outside the source tree
        run: |
          SDIST="$(ls "$PWD"/dist/*.tar.gz)"
          python -m pip install "sosfuse2[test] @ file://$SDIST"
          # runs the test files of a shard in parallel, one file per worker (see the test step)
          python -m pip install "pytest-xdist==3.8.0"
      - name: Compiler for the kernel syntax tests
        run: clang++ --version
      - run: zstd --version
      - name: IPRT inputs (network, pinned sha256)
        working-directory: ${{ runner.temp }}
        run: python -B -c "from sosfuse2.asset_tools import iprt; iprt.inputs()"
      - name: Installed package smoke (resources readable)
        working-directory: ${{ runner.temp }}
        run: |
          python -B -c "import sosfuse2, importlib.resources as r; p=r.files('sosfuse2'); \
            [ (p/f).read_bytes() for f in ('backends/kernel.cu','backends/native/sh_cpu.cpp','assets/rgb_weights.npy','checks/gate_data/baselines/numpy/FX-C3.npz') ]; \
            print(sosfuse2.__name__, p)"
      - name: Runner CPU and NumPy SIMD dispatch
        # NumPy picks its float32 kernels by CPU (X86_V3 = AVX2, X86_V4 = AVX-512); a failure seen on only some runners
        # can be matched to the dispatch it ran with.
        working-directory: ${{ runner.temp }}
        run: |
          python -B -c "import platform, numpy as np; print(platform.platform(), platform.machine()); np.show_runtime()"
          if command -v lscpu >/dev/null; then LC_ALL=C lscpu | grep -E '^(Model name|CPU\(s\)|Flags)' | cut -c1-200
          else sysctl -n machdep.cpu.brand_string hw.ncpu; fi
      - name: Packaged tests from the installed package
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/ci
        # Most test files keep one core busy, so the files of a shard run side by side on all cores of the runner;
        # --dist loadfile keeps each file in one worker, as in a serial run. The shard weights are measured file times, and
        # the longest files start first so that the file that bounds the shard's time does not wait for its turn.
        run: >-
          python -B -m pytest -q -p no:cacheprovider -rsxX --durations=25
          -n "$(python -c 'import os; print(os.cpu_count() or 1)')" --dist loadfile
          -p ci_shard --pyargs sosfuse2 --ci-shard ${{ matrix.shard }}/${{ needs.shard-config.outputs.count }}
          --ci-shard-weights "$GITHUB_WORKSPACE/.github/ci/shard_weights.json" --ci-shard-order weight

  # one status for all shards and the coverage check
  tests-passed:
    needs: [tests, shard-coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          TESTS_RESULT: ${{ needs.tests.result }}
          COVERAGE_RESULT: ${{ needs.shard-coverage.result }}
        run: test "$TESTS_RESULT" = success && test "$COVERAGE_RESULT" = success

  shard-coverage:
    needs: [lint, shard-config]
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SHARD_COUNT: ${{ needs.shard-config.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and install the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
          SDIST="$(ls "$PWD"/dist/*.tar.gz)"
          python -m pip install "sosfuse2[test] @ file://$SDIST"
      - name: Check shard coverage
        working-directory: ${{ runner.temp }}
        run: python -B "$GITHUB_WORKSPACE/.github/ci/check_shards.py" --python "$(command -v python)" --counts "$SHARD_COUNT"
          --weights "$GITHUB_WORKSPACE/.github/ci/shard_weights.json"
