# gitleaks configuration for this repository (extends the default rules).
title = "sosfuse2"

[extend]
useDefault = true

[allowlist]
description = "Known false positives"
regexTarget = "line"
regexes = [
  # solve/ksplit_tolerance.py builds environment-variable names with this prefix; the generic-api-key rule matches the identifier.
  '''SOSFUSE2_KSPLIT_VERIFY_''',
]
